<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birr Watch</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <h1>❤️😊 Birr Watch ⌚💸</h1>
      <p>Live Ethiopian Birr Exchange Rates</p>

      <p id="status">Loading rates...</p>

      <form id="convertForm">
        <input
          type="number"
          id="amount"
          placeholder="Enter ETB amount"
          min="0"
          step="any"
        />

        <select id="currency">
          <option value="">Select currency</option>
        </select>

        <button type="submit">Convert</button>
      </form>

      <div id="result"></div>

      <h2>Watchlist</h2>

      <ul id="watchlist"></ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
