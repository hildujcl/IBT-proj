<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Addis Market Shopping List</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="container">
      <h1>🛒 Addis Market</h1>

      <p>Shopping List</p>

      <form id="add-form">
        <input type="text" id="name" placeholder="Item name" />

        <input type="number" id="price" placeholder="Price in ETB" min="1" />

        <button type="submit">Add Item</button>
      </form>

      <p id="error"></p>

      <ul id="list"></ul>
      
      <div class="total">
        <strong>
          Total:
          <span id="total">0.00</span> ETB
        </strong>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
