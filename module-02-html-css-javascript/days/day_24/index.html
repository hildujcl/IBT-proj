<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Addis Eats</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="logo">🍴 Addis Eats</div>

      <nav>
        <a href="#home">Home</a>
        <a href="#menu">Menu</a>
        <a href="#cart">
          Cart 🛒
          <span id="cart-count">0</span>
        </a>
      </nav>
    </header>

    <main class="app-layout">
      <!-- LEFT SIDE -->
      <section class="main-area">
        <!-- SMALL WELCOME AREA -->
        <section id="home" class="welcome">
          <div>
            <h1>
              Delicious Ethiopian Food
              <span>💗</span>
            </h1>

            <p>Discover your favorite Ethiopian dishes.</p>
          </div>

          <a href="#menu" class="browse-btn"> Browse Menu → </a>
        </section>

        <!-- MENU -->
        <section id="menu" class="menu-section">
          <div class="section-heading">
            <div>
              <h2>Our Menu</h2>
              <p>Choose something delicious today!</p>
            </div>
          </div>

          <!-- SEARCH + FILTER -->
          <div class="controls">
            <div class="search">
              <span>🔎</span>

              <input
                type="text"
                id="search"
                placeholder="Search food..."
                aria-label="Search food"
              />
            </div>

            <select id="category" aria-label="Filter by category">
              <option value="All">All Categories</option>

              <option value="Breakfast">Breakfast</option>

              <option value="Lunch">Lunch</option>

              <option value="Dinner">Dinner</option>

              <option value="Drinks">Drinks</option>
            </select>
          </div>

          <!-- FOOD -->
          <div id="menu-container" class="menu-container">
            <p class="loading">Loading menu...</p>
          </div>
        </section>
      </section>

      <!-- RIGHT SIDEBAR -->
      <aside class="sidebar">
        <!-- CART -->
        <section id="cart" class="side-card">
          <div class="side-title">
            <h2>Your Cart</h2>
            <span>🛒</span>
          </div>

          <div id="cart-container">
            <p class="empty-cart">No items added yet.</p>
          </div>

          <div class="cart-total-box">
            <div>
              <span>Total items</span>
              <strong id="sidebar-count">0</strong>
            </div>

            <div>
              <span>Total</span>

              <strong class="total-price">
                <span id="cart-total">0</span>
                ETB
              </strong>
            </div>
          </div>

          <button id="clear-cart" class="clear-btn" type="button">
            Clear Cart
          </button>
        </section>

        <!-- CHECKOUT -->
        <section id="checkout" class="side-card checkout-card">
          <div class="side-title">
            <h2>Checkout</h2>
            <span>💗</span>
          </div>

          <form id="checkout-form" novalidate>
            <div class="form-group">
              <label for="name"> Your name </label>

              <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
              />

              <small id="name-error" class="error"></small>
            </div>

            <div class="form-group">
              <label for="phone"> Phone number </label>

              <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="09XXXXXXXX"
              />

              <small id="phone-error" class="error"></small>
            </div>

            <div id="checkout-error" class="checkout-error"></div>

            <button type="submit" class="checkout-btn">Place Order 🍽️</button>
          </form>

          <div id="confirmation" class="confirmation hidden"></div>
        </section>
      </aside>
    </main>

    <footer>
      <p>© 2026 Addis Eats 💗</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
